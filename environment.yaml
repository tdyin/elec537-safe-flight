name: safe-flight
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip>=23.0
  
  # Core scientific computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  
  # Computer vision
  - opencv>=4.5.0
  - pillow>=9.0.0
  
  # Data handling
  - pandas>=1.3.0
  - h5py>=3.6.0
  - pyyaml>=6.0
  
  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  
  # Development tools
  - pytest>=7.0.0
  - pytest-cov>=3.0.0
  - black>=22.0.0
  - flake8>=4.0.0
  - isort>=5.10.0
  
  # Utilities
  - tqdm>=4.62.0
  
  # Install via pip (not available in conda or better from PyPI)
  - pip:
    # ONNX Runtime for edge deployment
    - onnxruntime>=1.16.0
    
    # Advanced CV libraries
    - scikit-image>=0.19.0
    - albumentations>=1.3.0
    
    # Point cloud processing
    - open3d>=0.16.0
    
    # Crazyflie drone interface
    - cflib>=0.1.20
    
    # Logging
    - loguru>=0.6.0
