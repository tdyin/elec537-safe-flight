# Safe Flight - Default Configuration
# 
# This is the default config used when no --config argument is provided.
# For explicit environment configs, use:
#   - config/sim.yaml      (simulation-specific settings)
#   - config/hardware.yaml (real drone with conservative settings)
#
# Usage:
#   python launch_sim.py                    # Uses this file
#   python launch_sim.py --config config/sim.yaml  # Explicit sim config

# Vision Module Configuration
vision:
  # Depth-based vision for obstacle detection
  mode: "depth"
  
  # Monocular depth estimation model (MiDaS)
  depth:
    model_path: "models/midas_v21_small.onnx"
    depth_scale: 1.0  # Scale factor for depth values
    use_gpu: false
    model_height: 256  # Model input height
    model_width: 256   # Model input width
    # Model options:
    #   - midas_v21_small.onnx (256x256, fast)
    #   - midas_v21.onnx (384x384, accurate)
    #   - dpt_hybrid.onnx (384x384, state-of-the-art)
  
  # Image preprocessing
  target_size: [256, 256]
  normalize: true
  
  # Obstacle detection parameters
  obstacle:
    min_area: 100  # Minimum pixel area for obstacles
    depth_threshold: 2.5  # Maximum depth to consider (meters)
    # Clearance thresholds (normalized depth: 0=close, 1=far)
    # Made more sensitive to catch thin horizontal obstacles earlier
    critical_threshold: 0.15   # Very close (~1m) - emergency (was 0.10)
    close_threshold: 0.25      # Close (~2m) - must maneuver (was 0.20)
    caution_threshold: 0.40    # Approaching (~3m) - prepare (was 0.35)
    far_threshold: 0.55        # Far (~5m) - safe to proceed (was 0.50)
    # ROI configuration - focus on relevant flight path area
    roi_top_ratio: 0.20        # Ignore top 20% (sky/ceiling)
    roi_bottom_ratio: 0.70     # Ignore bottom 30% (floor) - expanded for horizontal obstacles

# Sensor Fusion Configuration
fusion:
  # Depth-based fusion
  depth_weight: 1.0       # Monocular depth reliability
  confidence_threshold: 0.4
  
  # 3D occupancy grid parameters
  grid_size: [20, 20, 10]  # Grid cells (x, y, z)
  grid_bounds: [5.0, 5.0, 3.0]  # Physical bounds in meters
  
# Drone Configuration
drone:
  uri: "radio://0/80/2M/E7E7E7E7E7"
  
  # Navigation parameters
  navigation:
    # Speed and safety
    cruise_speed: 1.0  # m/s - normal flight speed
    avoidance_speed: 0.5  # m/s - speed during obstacle avoidance
    max_speed: 2.0  # m/s - absolute maximum speed
    safety_distance: 1.0  # meters - minimum distance to obstacles
    
    # Altitude limits
    max_altitude: 2.0  # meters
    min_altitude: 0.5  # meters
    default_altitude: 0.8 # meters - target flight height
    
    # Path planning
    waypoint_radius: 0.3  # meters - waypoint reach threshold
    lookahead_distance: 1.0  # meters - path lookahead
    
    # Obstacle zones (depth values: 0=close, 1=far)
    zone_critical: 0.2  # Emergency stop threshold
    zone_close: 0.35    # Active avoidance threshold
    zone_caution: 0.5   # Slow down threshold
    zone_clear: 0.6     # Normal navigation threshold
    
    # Avoidance behavior
    avoidance_duration: 1.5  # seconds - minimum avoidance maneuver time
    turn_rate: 1.0  # rad/s - yaw rate during avoidance
    recovery_time: 0.5  # seconds - stabilization time after avoidance
    
    # Crash detection
    crash_tilt_threshold: 45.0  # degrees
    crash_altitude_threshold: 0.1  # meters
    warning_tilt_threshold: 25.0  # degrees - reduce aggressiveness
    min_flight_altitude: 0.3  # meters - takeoff complete threshold
  
  # Path planning
  path_planning:
    enabled: true
    planning_resolution: 0.1  # meters
    safety_margin: 3          # grid cells to maintain from obstacles
    smoothness_weight: 0.4    # weight for favoring smooth paths (0-1)
    diagonal_cost: 1.414      # cost for diagonal movement
    straight_cost: 1.0        # cost for straight movement
    replan_interval: 10       # frames between replanning
    path_smoothing: "bezier"  # smoothing method: 'bezier', 'spline', or 'none'
    max_deviation: 1.5        # max allowed deviation before returning to path (m)
    return_speed_ratio: 0.7   # ratio of cruise speed when returning to path
    
  # Avoidance controller
  avoidance:
    avoidance_gain: 1.0       # gain for avoidance maneuvers
    planning_horizon: 5       # look-ahead frames for planning
    velocity_smoothing: 0.2   # EMA alpha for velocity (lower = smoother)
    recovery_smoothing: 0.1   # slower smoothing during recovery
    recovery_time: 1.0        # seconds to recover from emergency
    recovery_backup_distance: 0.1  # distance to back up during recovery (m)
    max_history: 5            # frames for velocity history
    # Speed ratios relative to max_speed
    cruise_speed_ratio: 0.6   # normal cruise speed
    caution_speed_ratio: 0.3  # speed during caution
    # Distance thresholds relative to safety_distance
    caution_distance_ratio: 2.0      # caution zone
    detection_distance_ratio: 4.0    # detection zone
    emergency_distance_ratio: 0.5    # emergency zone
    repulsive_gain_ratio: 1.5        # repulsive force gain ratio
  
  # Control loop frequency
  control_frequency: 50  # Hz
  
  # SITL simulation configuration
  simulation:
    host: "localhost"
    port: 10020
    world_file: "sim/webots/worlds/crazyflie_apartment.wbt"
    controller: "crazyflie_sitl"
    # Velocity control
    smoothing_alpha: 0.08     # velocity smoothing (lower = smoother)
    max_velocity: 0.30        # absolute max velocity (m/s)
    max_yaw_rate: 0.6         # max yaw rate (rad/s)
    # Tilt safety thresholds (degrees)
    warning_tilt: 18.0        # reduce command aggressiveness
    critical_tilt: 28.0       # emergency response threshold
    # Stuck detection
    stuck_detection_enabled: true
    stuck_history_size: 20    # positions to track
    stuck_threshold: 0.05     # minimum progress expected (m)
    stuck_time_window: 3.0    # time window to check (s)
    # Emergency recovery
    emergency_backup_speed: -0.10  # backward speed during emergency
    emergency_timeout: 2.0         # seconds before forced avoidance
    # Display
    print_interval: 10        # print status every N frames

  # Safety monitor
  safety:
    crash_tilt_threshold: 35.0      # degrees - crash detection
    warning_tilt_threshold: 25.0    # degrees - reduce aggressiveness
    crash_altitude_threshold: 0.50  # meters - below this is crash
    min_flight_altitude: 1.0        # meters - takeoff complete
    position_history_size: 30       # frames for crash analysis (~1s at 32ms)

# Logging Configuration
logging:
  level: "INFO"
  log_to_file: true
  log_directory: "sim/webots/logs"
  
# Data Collection Configuration
data:
  save_detections: true
  save_sensor_data: false
  output_directory: "data/processed"
